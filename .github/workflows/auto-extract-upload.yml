name: Auto Extract Project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'UMESH_PRAKASH_SINGH_DIGITAL_AI_DIRECTOR_FINAL_TECHNICAL_AUDITED.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Project ZIP
        run: |
          ZIP_FILE="UMESH_PRAKASH_SINGH_DIGITAL_AI_DIRECTOR_FINAL_TECHNICAL_AUDITED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/ups_director_package"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Project folder missing!"
            exit 1
          fi

          rsync -a "$PROJECT_DIR/" ./

          rm "$ZIP_FILE"
          rm -rf extracted

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract complete AI Director project"
            git push
          else
            echo "No changes to commit"
          fi
